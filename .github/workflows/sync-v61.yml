name: Sync InspectFlow V6.1 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-v61]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download V6.1 source
        run: |
          curl -fL --retry 3 https://inspectflow-v61-source.miniup.app/inspectflow-dashboard-v6.1.zip -o /tmp/inspectflow-v61.zip
          rm -rf /tmp/inspectflow-v61
          mkdir -p /tmp/inspectflow-v61
          unzip -q /tmp/inspectflow-v61.zip -d /tmp/inspectflow-v61
      - name: Synchronize structured source
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/inspectflow-v61/ ./
      - name: Commit V6.1
        run: |
          git config user.name 'InspectFlow Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[sync-v61] Complete 15-section Field App and server voice transcription'
          git push origin HEAD:main
