name: Sync InspectFlow V6.2 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-v62]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download V6.2 source
        run: |
          curl -fL --retry 3 https://inspectflow-v62-source.miniup.app/inspectflow-dashboard-v6.2.zip -o /tmp/inspectflow-v62.zip
          rm -rf /tmp/inspectflow-v62
          mkdir -p /tmp/inspectflow-v62
          unzip -q /tmp/inspectflow-v62.zip -d /tmp/inspectflow-v62
      - name: Synchronize module-specific source
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/inspectflow-v62/ ./
      - name: Commit V6.2
        run: |
          git config user.name 'InspectFlow Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[sync-v62] Replace generic records with module-specific operations UI'
          git push origin HEAD:main
