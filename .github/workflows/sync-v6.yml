name: Sync InspectFlow V6 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-v6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download structured source
        run: |
          curl -fL --retry 3 https://inspectflow-v6-source.miniup.app/inspectflow-dashboard-v6.zip -o /tmp/inspectflow-v6.zip
          rm -rf /tmp/inspectflow-v6
          mkdir -p /tmp/inspectflow-v6
          unzip -q /tmp/inspectflow-v6.zip -d /tmp/inspectflow-v6
      - name: Replace legacy source with structured application
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/inspectflow-v6/ ./
          git status --short
      - name: Commit synchronized source
        run: |
          git config user.name 'InspectFlow Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m '[sync-v6] Replace legacy shell with structured Next.js application'
          git push origin HEAD:main
